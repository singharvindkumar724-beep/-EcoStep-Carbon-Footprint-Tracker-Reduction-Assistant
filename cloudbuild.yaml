# ─────────────────────────────────────────────────────────────────
# Cloud Build CI/CD pipeline for EcoStep → Cloud Run
# Project: ecostep-498816  |  Region: asia-south1 (Mumbai)
#
# Usage:
#   gcloud builds submit --config cloudbuild.yaml
# ─────────────────────────────────────────────────────────────────

steps:
  # Step 1: Build the Docker image
  - name: "gcr.io/cloud-builders/docker"
    args:
      - build
      - -t
      - "asia-south1-docker.pkg.dev/ecostep-498816/ecostep/app:latest"
      - .
    id: "build-image"

  # Step 2: Push the image to Artifact Registry
  - name: "gcr.io/cloud-builders/docker"
    args:
      - push
      - "asia-south1-docker.pkg.dev/ecostep-498816/ecostep/app:latest"
    id: "push-image"
    waitFor: ["build-image"]

  # Step 3: Deploy to Cloud Run
  # GEMINI_API_KEY is pulled from Secret Manager — never hardcoded
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "gcloud"
    args:
      - run
      - deploy
      - "ecostep"
      - --image=asia-south1-docker.pkg.dev/ecostep-498816/ecostep/app:latest
      - --region=asia-south1
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --memory=512Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=10
      - --set-secrets=GEMINI_API_KEY=GEMINI_API_KEY:latest
    id: "deploy"
    waitFor: ["push-image"]

# Store the built image in Artifact Registry
images:
  - "asia-south1-docker.pkg.dev/ecostep-498816/ecostep/app:latest"

options:
  logging: CLOUD_LOGGING_ONLY
