# ─────────────────────────────────────────────────────────────────
# Cloud Build CI/CD pipeline for EcoStep → Cloud Run
#
# Usage:
#   gcloud builds submit --config cloudbuild.yaml
#
# Required substitutions (set via --substitutions flag or Cloud Build trigger):
#   _PROJECT_ID  : Your GCP Project ID  (e.g. my-project-123456)
#   _REGION      : Cloud Run region      (default: us-central1)
#   _SERVICE     : Cloud Run service name (default: ecostep)
# ─────────────────────────────────────────────────────────────────

substitutions:
  _PROJECT_ID: "ecostep-498816"           # GCP Project ID
  _REGION: "asia-south1"                  # Mumbai — lowest latency from India
  _SERVICE: "ecostep"
  _IMAGE: "asia-south1-docker.pkg.dev/${_PROJECT_ID}/ecostep/app"

steps:
  # Step 1: Build the Docker image
  - name: "gcr.io/cloud-builders/docker"
    args:
      - build
      - -t
      - "${_IMAGE}:${SHORT_SHA}"
      - -t
      - "${_IMAGE}:latest"
      - .
    id: "build-image"

  # Step 2: Push the image to Artifact Registry
  - name: "gcr.io/cloud-builders/docker"
    args:
      - push
      - "--all-tags"
      - "${_IMAGE}"
    id: "push-image"
    waitFor: ["build-image"]

  # Step 3: Deploy to Cloud Run
  # GEMINI_API_KEY is pulled from Secret Manager — never hardcoded
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "gcloud"
    args:
      - run
      - deploy
      - "${_SERVICE}"
      - --image=${_IMAGE}:${SHORT_SHA}
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --memory=512Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=10
      - --set-secrets=GEMINI_API_KEY=GEMINI_API_KEY:latest
    id: "deploy"
    waitFor: ["push-image"]

# Store the built image in Artifact Registry
images:
  - "asia-south1-docker.pkg.dev/${_PROJECT_ID}/ecostep/app:${SHORT_SHA}"
  - "asia-south1-docker.pkg.dev/${_PROJECT_ID}/ecostep/app:latest"

options:
  logging: CLOUD_LOGGING_ONLY
